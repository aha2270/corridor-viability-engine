project:
  name: "corridor-viability-engine"
  state: "PA"

scope:
  penndot_county_codes: ["21", "22", "38"] # Cumberland (21), Dauphin (22), Lebanon (38)
  census_county_fips: ["041", "043", "075"]
  bbox: [-77.45, 40.05, -76.35, 40.65] # [min_lon, min_lat, max_lon, max_lat]

endpoints:
  penndot_traffic_url: "https://gis.penndot.pa.gov/arcgis/rest/services/opendata/roadwaytraffic/MapServer/0/query"
  census_api_base: "https://api.census.gov/data/2023/acs/acs5"
  overpass_mirrors:
    - "https://overpass-api.de/api/interpreter"
    - "https://lz4.overpass-api.de/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
  nrel_base_url: "https://developer.nlr.gov/api/alt-fuel-stations/v1.json"

penndot_attributes:
  - "OBJECTID"
  - "ST_RT_NO"
  - "CTY_CODE"
  - "SEG_LNGTH_FEET"
  - "CUR_AADT"
  - "ADTT_CUR"
  - "TRK_PCT"
  - "DLY_TRK_VMT"

census_variables:
  total_population: "B01003_001E"
  median_household_income: "B19013_001E"
  civilian_labor_force: "B23025_003E"
  unemployed_population: "B23025_005E"

thresholds:
  travel_plaza_truck_pct: 18
  buffer_radius_meters: 1609.34